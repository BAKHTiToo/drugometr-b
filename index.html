<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#BFC4FE">
<title>Другометр · концепт B</title>
<style>
/* ==========================================================================
   alfa-tokens.css — токены Альфа-Банка для HTML-прототипов
   Источник правды: Research/Концепты главного экрана 2026-10-04/_kit/
     palette.json      — 311 переменных библиотек Альфы (светлая + _inverted)
     android_type.json — шкала Android :: Typography
     design-dump-v2    — реальные iOS-метрики из Figma (Prototypes/promo-activation-history)
   Правило: в прототипе НЕ писать HEX/px руками — только var(--alfa-…).
   Нужен цвет, которого нет ниже, — взять из palette.json, добавить сюда
   с комментарием-источником, а не в CSS экрана.
   ========================================================================== */

/* ---------- Шрифты: только установленные в ~/Library/Fonts ----------------
   Alfa_Interface_Sans_Full-Regular.otf  full name «Alfa Interface Sans Full»,        PS AlfaInterfaceSansFull-Regular
   Alfa_Interface_Sans_Full-Medium.otf   full name «Alfa Interface Sans Full Medium», PS AlfaInterfaceSansFull-Medium
   Alfa_Interface_Sans_Full-Bold.otf     full name «Alfa Interface Sans Full Bold»,   PS AlfaInterfaceSansFull-Bold
   Alfa_Condenced_Bold.otf               full name «Alfa Condenced Bold»,             PS Alfa_Condenced_Bold
   local() в Chrome ищет по full name и PostScript name — даём оба.
   Шрифтов нет на машине зрителя (артефакт, чужой ноутбук) → фоллбек в --alfa-font-sans. */
@font-face {
  font-family: "Alfa Interface Sans";
  src: local("Alfa Interface Sans Full"), local("AlfaInterfaceSansFull-Regular"), local("Alfa Interface Sans Full Regular");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Alfa Interface Sans";
  src: local("Alfa Interface Sans Full Medium"), local("AlfaInterfaceSansFull-Medium");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Alfa Interface Sans";
  src: local("Alfa Interface Sans Full Bold"), local("AlfaInterfaceSansFull-Bold");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
/* Капс-заголовки промо. Только Bold, только крупно.
   ВНИМАНИЕ: в Alfa Condenced НЕТ цифр, «₽», «+», «%» и узкого пробела (проверено CoreText 17.10.2026) —
   цифры в нём падают в фоллбек. Промо-цифры набирать .t-display (Alfa Interface Sans). */
@font-face {
  font-family: "Alfa Condenced";
  src: local("Alfa Condenced Bold"), local("Alfa_Condenced_Bold");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

:root {
  /* ---------- Семейства ---------- */
  --alfa-font-sans: "Alfa Interface Sans", "SF Pro Text", -apple-system, system-ui, Roboto, sans-serif;
  --alfa-font-promo: "Alfa Condenced", "Alfa Interface Sans", "SF Pro Display", sans-serif;

  /* ---------- Начертания ---------- */
  --alfa-fw-regular: 400;
  --alfa-fw-medium: 500;   /* заголовки и кнопки — Medium, как HeadlineX / ActionX в android_type.json */
  --alfa-fw-bold: 700;     /* только акценты: AccentSecondaryMedium, промо-цифры */

  /* ---------- Типографика: 7 кеглей, больше не вводить ----------
     имя            кегль/интерлиньяж   android_type.json            iOS-дамп Figma */
  --alfa-fs-display: 40px;  --alfa-lh-display: 48px;  /* HeadlineXLarge 40/48 Medium   — сумма-герой, промо-цифра (Interface Sans, не Condenced) */
  --alfa-fs-h1: 26px;       --alfa-lh-h1: 32px;       /* HeadlineMedium 26/32 Medium   ≈ iOS 27/32 «Остался 1 друг» */
  --alfa-fs-h2: 20px;       --alfa-lh-h2: 28px;       /* HeadlineSmall 20/28 Medium    ≈ iOS 22/28 заголовок шторки */
  --alfa-fs-body-l: 17px;   --alfa-lh-body-l: 24px;   /* ParagraphPrimaryLarge 18/24   = iOS 17/24 строка ячейки, навбар, кнопка L */
  --alfa-fs-body: 15px;     --alfa-lh-body: 20px;     /* ParagraphPrimarySmall 14/20   = iOS 15/20 (самый частый в дампе) */
  --alfa-fs-caption: 13px;  --alfa-lh-caption: 18px;  /* ParagraphSecondaryLarge 13/20 = iOS 13/18 подписи, тост */
  --alfa-fs-micro: 12px;    --alfa-lh-micro: 16px;    /* ParagraphSecondaryMedium 12/16 — бейджи, таб-бар. Мельче 12 нельзя (чек-лист п. 9) */

  /* ---------- Радиусы: 4 значения ---------- */
  --alfa-r-s: 8px;      /* бейдж-квадрат, иконка 24, внутренний сегмент */
  --alfa-r-m: 12px;     /* кнопки M/S, поле ввода, сегмент-контрол (iOS-дамп: r 12 у «Активировать») */
  --alfa-r-l: 16px;     /* карточки, баннеры, кнопка L, верх шторки (дамп: r 16 — 129 раз) */
  --alfa-r-full: 999px; /* аватары, иконки-кружки, тост, бейдж статуса */

  /* ---------- Отступы ---------- */
  --alfa-space-4: 4px;
  --alfa-space-8: 8px;
  --alfa-space-12: 12px;
  --alfa-space-16: 16px;
  --alfa-space-20: 20px;  /* боковое поле экрана iOS (сетка 20 в дампе) */
  --alfa-space-24: 24px;
  --alfa-space-32: 32px;
  --alfa-gutter: var(--alfa-space-20);

  /* ---------- Каркас iPhone 14 (390×844) ---------- */
  --alfa-device-w: 390px;
  --alfa-device-h: 844px;
  --alfa-statusbar-h: 47px;
  --alfa-navbar-h: 44px;
  --alfa-tabbar-h: 49px;
  --alfa-home-indicator-h: 34px;
  --alfa-control-l: 56px;  /* кнопка L, поле ввода */
  --alfa-control-m: 48px;
  --alfa-control-s: 40px;  /* кнопка S в карточке (дамп: 137×40) */

  /* ---------- Движение ---------- */
  --alfa-ease: cubic-bezier(.4, 0, .2, 1);       /* push — как в web/style.css эталонного прототипа */
  --alfa-ease-out: cubic-bezier(.2, .8, .2, 1);  /* шторка */
  --alfa-dur-push: 360ms;
  --alfa-dur-sheet: 300ms;
  --alfa-dur-fast: 180ms;

  /* ---------- Тени (Альфа почти плоская — тени только у парящего) ---------- */
  --alfa-shadow-float: 0 8px 16px rgb(11 31 53 / .16), 0 0 16px rgb(11 31 53 / .08); /* ToastView в Figma: DROP_SHADOW #0b1f3529 0,8 r16 + #0b1f3514 0,0 r16 */
  --alfa-shadow-card: 0 4px 16px rgb(11 31 53 / .08);                                  /* поднятая карточка поверх контента */
  --alfa-shadow-sheet: 0 -4px 24px rgb(11 31 53 / .08);                                /* край шторки на светлом фоне */

  /* ===================== ЦВЕТ: СВЕТЛАЯ ТЕМА =====================
     В комментарии — переменная palette.json. «a88» = альфа 88 %. */
  color-scheme: light;

  /* Фоны */
  --alfa-bg: #FFFFFF;                          /* base-bg/primary */
  --alfa-bg-secondary: #F2F3F5;                /* base-bg/secondary */
  --alfa-surface: #F2F3F5;                     /* neutral/100 — карточка на белом фоне */
  --alfa-surface-raised: #FFFFFF;              /* base-bg/tertiary — карточка на сером фоне, кнопка на карточке */
  --alfa-surface-modal: #FFFFFF;               /* modal-bg/primary — шторка */
  --alfa-fill-control: rgb(38 55 88 / .06);    /* neutral-translucent/100 #263758 a6 — вторичная кнопка, поле, сегмент */
  --alfa-fill-control-pressed: rgb(15 25 55 / .10); /* neutral-translucent/300 #0F1937 a10 */
  --alfa-separator: rgb(15 25 55 / .10);       /* neutral-translucent/300 #0F1937 a10 */
  --alfa-grabber: #BABBC2;                     /* neutral/500 */
  --alfa-overlay: rgb(0 0 0 / .60);            /* overlay/default #000000 a60 */

  /* Текст и иконки */
  --alfa-text-primary: rgb(3 3 6 / .88);       /* text/primary #030306 a88 */
  --alfa-text-secondary: rgb(4 4 19 / .55);    /* text/secondary #040413 a55 */
  --alfa-text-tertiary: rgb(5 8 29 / .38);     /* text/tertiary #05081D a38 — плейсхолдер, неактивное */
  --alfa-icon-secondary: #898991;              /* neutral/700 — неактивный таб, шеврон */

  /* Акцент */
  --alfa-accent: #EF3124;                      /* accent/primary — красный Альфы: метка, главное действие */
  --alfa-accent-secondary: #212124;            /* accent/secondary — чёрная кнопка */
  --alfa-on-accent: rgb(255 255 255 / .94);    /* static_text_inverted/primary #FFFFFF a94 */
  --alfa-on-accent-secondary: rgb(255 255 255 / .94); /* static_text_inverted/primary */

  /* Статусы: текст / заливка-иконка / подложка бейджа */
  --alfa-positive: #0D9336;                    /* text/positive — зелёный ТОЛЬКО для зачислений */
  --alfa-positive-fill: #0CC44D;               /* status/positive */
  --alfa-positive-bg: #DFF8E5;                 /* status-muted/positive */
  --alfa-attention: #EA8313;                   /* text/attention */
  --alfa-attention-fill: #FA9313;              /* status/attention */
  --alfa-attention-bg: #FFEFD9;                /* status-muted/attention */
  --alfa-negative: #EC2D20;                    /* text/negative */
  --alfa-negative-fill: #FF4837;               /* status/negative */
  --alfa-negative-bg: #FFEBEB;                 /* status-muted/negative */
  --alfa-info: #2A77EF;                        /* text/info */
  --alfa-info-fill: #2288FA;                   /* status/info */
  --alfa-info-bg: #E4F0FF;                     /* status-muted/info */

  /* Тост (всегда тёмный, как ToastView в Figma: #202020 b8 + blur) */
  --alfa-toast-bg: rgb(28 28 30 / .90);        /* static_neutral_inverted/100 #1C1C1E + opacity .9 */
  --alfa-toast-text: rgb(255 255 255 / .94);   /* static_text_inverted/primary */
  --alfa-toast-text-secondary: rgb(238 238 251 / .55); /* static_text_inverted/secondary #EEEEFB a55 */

  /* Стенд вокруг телефона (не часть экрана) */
  --alfa-stage: #EDEEF0;                       /* neutral/200 */
}

/* ===================== ЦВЕТ: ТЁМНАЯ ТЕМА =====================
   Включается: <html data-theme="dark">, ?theme=dark в адресе (starter.html)
   или системной темой, если data-theme не задан. Все значения — *_inverted. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --alfa-bg: #121213;                          /* base-bg_inverted/primary */
  --alfa-bg-secondary: #1C1C1E;                /* base-bg_inverted/secondary */
  --alfa-surface: #1C1C1E;                     /* neutral_inverted/100 */
  --alfa-surface-raised: #29292C;              /* base-bg_inverted/tertiary */
  --alfa-surface-modal: #1C1C1E;               /* modal-bg_inverted/primary */
  --alfa-fill-control: rgb(214 214 229 / .07); /* neutral-translucent_inverted/100 #D6D6E5 a7 */
  --alfa-fill-control-pressed: rgb(222 222 238 / .13); /* neutral-translucent_inverted/300 #DEDEEE a13 */
  --alfa-separator: rgb(222 222 238 / .13);    /* neutral-translucent_inverted/300 */
  --alfa-grabber: #4A4A51;                     /* neutral_inverted/500 */
  --alfa-overlay: rgb(0 0 0 / .60);            /* overlay/default */

  --alfa-text-primary: rgb(255 255 255 / .94); /* text_inverted/primary #FFFFFF a94 */
  --alfa-text-secondary: rgb(238 238 251 / .55); /* text_inverted/secondary #EEEEFB a55 */
  --alfa-text-tertiary: rgb(233 233 250 / .37);  /* text_inverted/tertiary #E9E9FA a37 */
  --alfa-icon-secondary: #898991;              /* neutral_inverted/700 */

  --alfa-accent: #F83A2A;                      /* accent_inverted/primary */
  --alfa-accent-secondary: #F2F3F5;            /* accent_inverted/secondary — «чёрная» кнопка в тёмной теме светлая */
  --alfa-on-accent: rgb(255 255 255 / .94);    /* static_text_inverted/primary */
  --alfa-on-accent-secondary: rgb(3 3 6 / .88); /* static_text/primary */

  --alfa-positive: #0CC44D;                    /* text_inverted/positive */
  --alfa-positive-fill: #17D055;               /* status_inverted/positive */
  --alfa-positive-bg: #232D25;                 /* status-muted_inverted/positive */
  --alfa-attention: #FA9313;                   /* text_inverted/attention */
  --alfa-attention-fill: #FDA136;              /* status_inverted/attention */
  --alfa-attention-bg: #36291F;                /* status-muted_inverted/attention */
  --alfa-negative: #FF4837;                    /* text_inverted/negative */
  --alfa-negative-fill: #FF4837;               /* status_inverted/negative */
  --alfa-negative-bg: #392523;                 /* status-muted_inverted/negative */
  --alfa-info: #4A9DFC;                        /* text_inverted/info */
  --alfa-info-fill: #3193FC;                   /* status_inverted/info */
  --alfa-info-bg: #222A3E;                     /* status-muted_inverted/info */

  --alfa-toast-bg: rgb(53 53 57 / .94);        /* modal-bg_inverted/tertiary #353539 + opacity .94 */
  --alfa-shadow-float: 0 8px 16px rgb(0 0 0 / .40), 0 0 16px rgb(0 0 0 / .20);
  --alfa-shadow-card: 0 4px 16px rgb(0 0 0 / .32);
  --alfa-shadow-sheet: 0 -4px 24px rgb(0 0 0 / .32);
  --alfa-stage: #262629;                       /* neutral_inverted/0 */
}

/* Системная тёмная тема, если тема не задана явно — те же значения */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --alfa-bg: #121213;
    --alfa-bg-secondary: #1C1C1E;
    --alfa-surface: #1C1C1E;
    --alfa-surface-raised: #29292C;
    --alfa-surface-modal: #1C1C1E;
    --alfa-fill-control: rgb(214 214 229 / .07);
    --alfa-fill-control-pressed: rgb(222 222 238 / .13);
    --alfa-separator: rgb(222 222 238 / .13);
    --alfa-grabber: #4A4A51;
    --alfa-text-primary: rgb(255 255 255 / .94);
    --alfa-text-secondary: rgb(238 238 251 / .55);
    --alfa-text-tertiary: rgb(233 233 250 / .37);
    --alfa-accent: #F83A2A;
    --alfa-accent-secondary: #F2F3F5;
    --alfa-on-accent-secondary: rgb(3 3 6 / .88);
    --alfa-positive: #0CC44D;
    --alfa-positive-fill: #17D055;
    --alfa-positive-bg: #232D25;
    --alfa-attention: #FA9313;
    --alfa-attention-fill: #FDA136;
    --alfa-attention-bg: #36291F;
    --alfa-negative: #FF4837;
    --alfa-negative-fill: #FF4837;
    --alfa-negative-bg: #392523;
    --alfa-info: #4A9DFC;
    --alfa-info-fill: #3193FC;
    --alfa-info-bg: #222A3E;
    --alfa-toast-bg: rgb(53 53 57 / .94);
    --alfa-shadow-float: 0 8px 16px rgb(0 0 0 / .40), 0 0 16px rgb(0 0 0 / .20);
    --alfa-shadow-card: 0 4px 16px rgb(0 0 0 / .32);
    --alfa-shadow-sheet: 0 -4px 24px rgb(0 0 0 / .32);
    --alfa-stage: #262629;
  }
}

/* ---------- Типографические классы (единственное место, где кегль связан с текстом) ---------- */
.t-display { font: var(--alfa-fw-medium) var(--alfa-fs-display)/var(--alfa-lh-display) var(--alfa-font-sans); letter-spacing: -.01em; }
.t-promo   { font: var(--alfa-fw-bold) var(--alfa-fs-h1)/var(--alfa-lh-h1) var(--alfa-font-promo); text-transform: uppercase; } /* только буквы */
.t-h1      { font: var(--alfa-fw-medium) var(--alfa-fs-h1)/var(--alfa-lh-h1) var(--alfa-font-sans); }
.t-h2      { font: var(--alfa-fw-medium) var(--alfa-fs-h2)/var(--alfa-lh-h2) var(--alfa-font-sans); }
.t-body-l  { font: var(--alfa-fw-regular) var(--alfa-fs-body-l)/var(--alfa-lh-body-l) var(--alfa-font-sans); }
.t-body    { font: var(--alfa-fw-regular) var(--alfa-fs-body)/var(--alfa-lh-body) var(--alfa-font-sans); }
.t-caption { font: var(--alfa-fw-regular) var(--alfa-fs-caption)/var(--alfa-lh-caption) var(--alfa-font-sans); }
.t-micro   { font: var(--alfa-fw-medium) var(--alfa-fs-micro)/var(--alfa-lh-micro) var(--alfa-font-sans); }
.t-medium  { font-weight: var(--alfa-fw-medium); }
.t-secondary { color: var(--alfa-text-secondary); }
.t-tertiary  { color: var(--alfa-text-tertiary); }
.t-positive  { color: var(--alfa-positive); }
.t-negative  { color: var(--alfa-negative); }
.t-num { font-variant-numeric: tabular-nums; }

</style>
<style>
/* ==========================================================================
   components.css — каркас iPhone и компоненты прототипа на токенах Альфы.
   Только var(--alfa-…) из alfa-tokens.css. Ни одного HEX, кегля или радиуса руками.
   Метрики — из Figma-дампа Prototypes/promo-activation-history/design-dump-v2.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--alfa-font-sans);
  font-size: var(--alfa-fs-body);
  line-height: var(--alfa-lh-body);
  color: var(--alfa-text-primary);
  -webkit-font-smoothing: antialiased;
  font-kerning: normal;
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
svg.i { width: 24px; height: 24px; flex: none; fill: currentColor; display: block; }

/* ---------- Стенд: телефон по центру на десктопе, во весь экран на телефоне ---------- */
.stage {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: var(--alfa-space-24);
  background: var(--alfa-stage);
}
.device {
  position: relative;
  width: var(--alfa-device-w);
  height: var(--alfa-device-h);
  overflow: hidden;
  overflow: clip; /* clip, а не hidden: фокус и scrollIntoView не сдвигают «телефон» */
  isolation: isolate;
  background: var(--alfa-bg);
  border-radius: 48px; /* lint:allow — скругление корпуса телефона, не часть UI */
  box-shadow: var(--alfa-shadow-card);
}
/* Узкое окно (скриншоты 375 / 320, реальный телефон): телефон = окно */
@media (max-width: 480px) {
  .stage { padding: 0; display: block; }
  .device { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
  .stage-tools { display: none; }
}
.stage-tools {
  position: fixed;
  top: var(--alfa-space-16);
  right: var(--alfa-space-16);
  display: flex;
  gap: var(--alfa-space-8);
}

/* ---------- Статус-бар 47 (iPhone 14) ---------- */
.statusbar {
  position: absolute; z-index: 40; top: 0; left: 0; right: 0;
  height: var(--alfa-statusbar-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--alfa-space-12) var(--alfa-space-32) 0;
  color: var(--alfa-text-primary);
  pointer-events: none;
}
.statusbar__time { font: var(--alfa-fw-medium) var(--alfa-fs-body-l)/var(--alfa-lh-body-l) var(--alfa-font-sans); width: 54px; text-align: center; }
.statusbar__icons { display: flex; align-items: center; gap: var(--alfa-space-4); }
.statusbar__icons svg { fill: currentColor; display: block; }
.statusbar--on-dark { color: var(--alfa-on-accent); }

/* ---------- Home indicator ---------- */
.home-indicator {
  position: absolute; z-index: 60; left: 50%; bottom: var(--alfa-space-8);
  width: 134px; height: 5px; margin-left: -67px;
  border-radius: var(--alfa-r-full);
  background: var(--alfa-text-primary);
  pointer-events: none;
}

/* ---------- Экраны и переходы ---------- */
.screens { position: absolute; inset: 0; overflow: hidden; overflow: clip; }
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding-top: var(--alfa-statusbar-h);
  background: var(--alfa-bg);
  overflow: hidden; overflow: clip;
  visibility: hidden;
  will-change: transform;
}
.screen.is-active { visibility: visible; z-index: 2; }
.screen--secondary { background: var(--alfa-bg-secondary); }
.screen__content {
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain;
  scrollbar-width: none;
  padding: 0 var(--alfa-gutter) calc(var(--alfa-home-indicator-h) + var(--alfa-space-24));
}
.screen__content::-webkit-scrollbar { display: none; }
.screen.has-tabbar .screen__content { padding-bottom: calc(var(--alfa-tabbar-h) + var(--alfa-home-indicator-h) + var(--alfa-space-24)); }
.screen__footer {
  flex: none;
  padding: var(--alfa-space-12) var(--alfa-gutter) calc(var(--alfa-home-indicator-h) + var(--alfa-space-8));
  background: var(--alfa-bg);
}

/* push: новый экран въезжает справа, старый уходит на 30 % влево */
.screen.push-in      { visibility: visible; z-index: 3; transform: translateX(100%); }
.screen.push-out     { visibility: visible; z-index: 2; }
.screen.pop-in       { visibility: visible; z-index: 2; transform: translateX(-30%); }
.screen.pop-out      { visibility: visible; z-index: 3; }

.b-hero { padding: 0 20px; display: flex; flex-direction: column; align-items: center; gap: 24px; color: var(--b-text); }
.b-hero__pot { display: flex; flex-direction: column; align-items: center; gap: 4px; white-space: nowrap; }
.b-comb { align-self: stretch; display: flex; flex-direction: column; gap: 12px; }
.b-comb__sticks { display: flex; justify-content: space-between; }
.b-comb__sticks i { width: 4px; height: 28px; border-radius: 2px; background: var(--b-inv); }
.b-comb__sticks i.is-on { background: var(--b-green); }
.b-comb__labels { display: flex; justify-content: space-between; white-space: nowrap; }
.b-comb__labels > div { display: flex; flex-direction: column; gap: 2px; }
.b-comb__labels > div:last-child { align-items: flex-end; text-align: right; }
.b-green { color: var(--b-green); }
.b-b1-list { margin-top: 32px; display: flex; flex-direction: column; gap: 24px; }
.b-block { padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }
.b-block__head { display: flex; flex-direction: column; gap: 2px; color: var(--b-text); }

/* ---------- Карточка друга (B1, B2) ---------- */
.b-friends { display: flex; flex-direction: column; gap: 12px; }
.b-friend { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 24px; background: #fff; box-shadow: var(--b-shadow); }
.b-ava { flex: none; width: 48px; height: 48px; border-radius: 24px; background: var(--b-bg-2); display: grid; place-items: center; color: var(--b-text-2); font: 500 15px/20px var(--alfa-font-sans); letter-spacing: .24px; }
.b-friend__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; white-space: nowrap; color: var(--b-text); }
.b-chip { flex: none; width: 89px; height: 32px; padding: 4px 8px; border-radius: 16px; background: var(--b-bg-2); color: var(--b-text); font: 500 13px/18px var(--alfa-font-sans); letter-spacing: .33px; white-space: nowrap; }
.b-chip.is-on { background: var(--b-chip-on); color: var(--b-inv); }
.b-chip:active { opacity: .7; }

/* Коуч «Как мы подбираем друзей» */
.b-coach { padding: 0 20px; display: flex; align-items: flex-end; gap: 8px; }
.b-coach__face { flex: none; width: 48px; height: 48px; }
.b-coach__bubble { position: relative; flex: 1; min-width: 0; padding: 22px 56px 22px 20px; border-radius: 24px 24px 24px 4px; background: #fff; box-shadow: var(--b-shadow); color: var(--b-text); }
.b-coach__chev { position: absolute; right: 0; top: 0; bottom: 0; width: 56px; display: grid; place-items: center; }
.b-coach__chev img { width: 24px; height: 24px; display: block; }

/* ---------- Степпер ---------- */
.b-stepper { height: 24px; padding: 0 20px; display: flex; align-items: center; gap: 6px; }
.b-step { flex: none; display: flex; align-items: center; gap: 4px; color: var(--b-text-2); font: 500 12px/16px var(--alfa-font-sans); white-space: nowrap; }
.b-step__dot { width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; background: var(--b-future, var(--b-bg-2)); font: 500 13px/16px var(--alfa-font-sans); }
.b-step__dot img { width: 12px; height: 12px; display: block; }
.b-step.is-active, .b-step.is-done { color: var(--b-text); }
.b-step.is-active .b-step__dot, .b-step.is-done .b-step__dot { background: var(--b-text); color: var(--b-inv); }
.b-step--link { cursor: pointer; }
.b-step__line { flex: 1 1 13px; min-width: 13px; height: 2px; border-radius: 1px; background: var(--b-line); }
.b-step__line.is-done { background: var(--b-text); }
.b-stepper { justify-content: space-between; }

.b-title { padding: 0 20px; display: flex; flex-direction: column; gap: 4px; color: var(--b-text); }
.b-after-step { margin-top: 24px; }

/* ---------- Нижняя панель (B2, B3) и «К началу» (B4) ---------- */
.b-panel { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; padding: 16px 20px calc(16px + var(--b-bottom)); display: flex; flex-direction: column; gap: 16px;
  background: #fff; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 24px rgba(0, 0, 0, .08); }
.b-panel--plain { padding-top: 16px; background: #fff; box-shadow: none; border-radius: 0; } /* подложка: длинный список не просвечивает под «К началу» */
.b-sum { padding: 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--b-text); }
.b-sum > div { display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
.b-sum .t-22 { white-space: nowrap; }
.b-btn { width: 100%; height: 56px; padding: 0 20px; border-radius: 16px; background: var(--b-black); color: var(--b-inv); font: 500 17px/24px var(--alfa-font-sans); letter-spacing: .1px; }
.b-btn:active { opacity: .85; }
.b-btn:disabled { opacity: .3; cursor: default; }

/* ---------- B3: ленты продуктов ---------- */
.b-offers { margin-top: 24px; display: flex; flex-direction: column; gap: 24px; } /* 32 по макету − 8 «вылета» карточки 182 из ленты 174 */
.b-offer { display: flex; flex-direction: column; gap: 16px; }
.b-offer__who { padding: 0 20px; display: flex; align-items: center; gap: 12px; }
.b-offer__who .b-friend__txt { flex: 1; }
.b-lane { display: flex; gap: 8px; padding: 0 16px 8px; margin-bottom: -8px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; scroll-padding: 0 16px; }
.b-lane::-webkit-scrollbar { display: none; }
.b-card { position: relative; flex: none; width: 120px; height: 182px; border-radius: 24px; background: #fff; box-shadow: var(--b-shadow); overflow: hidden; text-align: left; display: flex; flex-direction: column; }
.b-card.is-on::after { content: ''; position: absolute; inset: 0; border-radius: 24px; box-shadow: inset 0 0 0 2px var(--b-text); pointer-events: none; }
.b-card__img { position: relative; flex: none; height: 96px; }
.b-card__img img { position: absolute; left: 6px; top: 8px; width: 99px; height: 81px; object-fit: cover; }
.b-card__amt { padding: 8px 12px 0; color: var(--b-green-text); font: 500 13px/18px var(--alfa-font-sans); letter-spacing: .33px; white-space: nowrap; }
.b-card__ttl { padding: 12px; color: var(--b-text); font: 500 13px/18px var(--alfa-font-sans); letter-spacing: .33px; }
.b-card:active { opacity: .8; }

/* ---------- B4: итог и список ---------- */
.b-total { margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 56px; text-align: center; color: var(--b-text); }
.b-sendlist { margin-top: 24px; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 24px; }
.b-send { display: flex; align-items: flex-start; gap: 12px; }
.b-send__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; color: var(--b-text); }
.b-send__btn { flex: none; height: 40px; padding: 8px 14px; border-radius: 20px; background: var(--b-bg-2); color: var(--b-text); font: 500 15px/20px var(--alfa-font-sans); letter-spacing: .24px; white-space: nowrap; }
.b-send__btn:active { opacity: .7; }

/* ---------- B5: нативная шторка шеринга (SexyOverlay) ---------- */
.scrim { background: rgba(0, 0, 0, .4); }
.b-share { padding: 4px 0 calc(16px + var(--b-bottom) + 13px); border-radius: 12px 12px 0 0; background: #fff; box-shadow: none; }
.b-share .sheet__grabber { width: 36px; height: 4px; margin: 0 0 0; border-radius: 20px; background: #B8B9C0; }
.b-share .sheet__header { padding: 12px 20px 4px; flex-direction: column; gap: 4px; }
.b-share__title { font: 500 19px/24px var(--alfa-font-sans); color: var(--b-text); }
.b-share__sub { font: 400 17px/22px var(--alfa-font-sans); color: var(--b-text-2); }
.b-share__list { margin-top: 16px; display: flex; padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
.b-share__list::-webkit-scrollbar { display: none; }
.b-share__cell { flex: none; width: 84px; padding: 2px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.b-share__cell:active { opacity: .6; }

  const friend = id => D.friends.find(f => f.id === id);
  const chosen = () => D.friends.filter(f => state.friends.has(f.id));
  const picksOf = f => f.products.filter(p => state.picks[f.id].has(p));

  /* ---------- B2 · Шаг 1. Друзья ---------- */
  function b2() {
    const list = D.friends.map(f => {
      const on = state.friends.has(f.id);
      return `<div class="b-friend">${ava(f)}<div class="b-friend__txt"><span class="t-15m">${f.name}</span><span class="t-13 c-2">до ${money(f.max)}</span></div>
        <button class="b-chip${on ? ' is-on' : ''}" data-toggle-friend="${f.id}" aria-pressed="${on}">${on ? (f.fem ? 'Выбрана' : 'Выбран') : 'Выбрать'}</button></div>`;
    }).join('');
    const sel = chosen(), max = sel.reduce((s, f) => s + f.max, 0);
    return `${nav()}<div class="b-scroll"><div class="b-bg b-bg--hero"></div><div class="b-content" style="padding-bottom:calc(176px + var(--b-bottom))">
      ${stepper(1, '#FFFFFF')}
      <div class="b-title b-after-step"><span class="t-22">Кому порекомендовать</span></div>
      <div class="b-friends" style="padding:0 20px;margin-top:24px">${list}</div>
      </div></div>
      <div class="b-panel"><div class="b-sum"><div><span class="t-15m">Можете получить</span><span class="t-13 c-2">${friendsNom(sel.length)}</span></div><span class="t-22">${sel.length ? 'до ' + money(max) : money(0)}</span></div>
        <button class="b-btn" data-go-step="b3"${sel.length ? '' : ' disabled'}>Выбрать предложения</button></div>`;
  }

  /* ---------- B3 · Шаг 2. Предложения ---------- */
  function b3() {
    const blocks = chosen().map(f => {
      const cards = f.products.map(p => {
        const pr = D.products[p], on = state.picks[f.id].has(p);
        return `<button class="b-card${on ? ' is-on' : ''}" data-toggle-pick="${f.id}:${p}" aria-pressed="${on}">
          <span class="b-card__img"><img src="${pr.img}" alt=""></span><span class="b-card__amt">Вам ${money(pr.reward)}</span><span class="b-card__ttl">${nl(pr.title)}</span></button>`;
      }).join('');
      return `<div class="b-offer"><div class="b-offer__who">${ava(f)}<div class="b-friend__txt"><span class="t-15m">${f.name}</span><span class="t-13 c-2">Можно получить до ${money(f.max)}</span></div></div>
        <div class="b-lane" data-lane="${f.id}">${cards}</div></div>`;
    }).join('');
    const t = totals();
    return `${nav()}<div class="b-scroll"><div class="b-bg b-bg--step"></div><div class="b-content" style="padding-bottom:calc(168px + var(--b-bottom))">
      ${stepper(2, '#F2F3F5')}
      <div class="b-title b-after-step"><span class="t-22">Что кому предложить</span><span class="t-13 c-2">Деньги придут, когда друг оформит продукт и${NB}выполнит условия</span></div>
      <div class="b-offers">${blocks}</div>
      </div></div>
      <div class="b-panel"><div class="b-sum"><div><span class="t-15m">Можете получить</span><span class="t-13 c-2">${prods(t.products)} для ${friendsGen(t.friends)}</span></div><span class="t-22">${money(t.sum)}</span></div>
        <button class="b-btn" data-go-step="b4"${t.products ? '' : ' disabled'}>Перейти к${NB}отправке</button></div>`;
  }

  /* ---------- B4 · Шаг 3. Отправка ---------- */
  function b4() {
    const t = totals();
    const rows = chosen().filter(f => picksOf(f).length).map(f => `<div class="b-send">${ava(f)}
      <div class="b-send__txt"><span class="t-15m">${f.name}</span><span class="t-13 c-2">${picksOf(f).map((p, i) => `<span class="np">${i ? D.products[p].short : cap(D.products[p].short)}</span>`).join(', ')}</span><span class="t-15m">${money(sumOf(f))}</span></div>
      <button class="b-send__btn" data-share="${f.id}">Отправить</button></div>`).join('');
    return `${nav()}<div class="b-scroll"><div class="b-bg b-bg--step"></div><div class="b-content" style="padding-bottom:calc(96px + var(--b-bottom))">
      ${stepper(3, '#F2F3F5')}
      <div class="b-total"><span class="t-40">${money(t.sum)}</span><span class="t-15 c-2">Можете получить за${NB}${prods(t.products)} для${NB}${friendsGen(t.friends)}</span></div>
      <div class="b-sendlist">${rows}</div>
      </div></div>
      <div class="b-panel b-panel--plain"><button class="b-btn" data-home>К${NB}началу</button></div>`;

=" alt="">', more: '<img src="data:image/svg+xml;base64,PHN2ZyBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiBvdmVyZmxvdz0idmlzaWJsZSIgc3R5bGU9ImRpc3BsYXk6IGJsb2NrOyIgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiB2aWV3Qm94PSIwIDAgMzIgMzIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxnIGlkPSJkb3RzLWhvcml6b250YWwiPgo8ZyBpZD0iaWNvbiI+CjxwYXRoIGQ9Ik0xNi42NjI0IDE4LjU4MzdDMTYuNDUwNiAxOC42Mzc5IDE2LjIyODcgMTguNjY2NyAxNiAxOC42NjY3QzE0LjUyNzIgMTguNjY2NyAxMy4zMzMzIDE3LjQ3MjggMTMuMzMzMyAxNkMxMy4zMzMzIDE0Ljc1MDIgMTQuMTkzMiAxMy43MDEyIDE1LjM1MzUgMTMuNDEyMkMxNS41NjA1IDEzLjM2MDcgMTUuNzc3IDEzLjMzMzMgMTYgMTMuMzMzM0MxNy40NzI3IDEzLjMzMzMgMTguNjY2NiAxNC41MjcyIDE4LjY2NjYgMTZDMTguNjY2NiAxNy4yNDQxIDE3LjgxNDcgMTguMjg5MiAxNi42NjI0IDE4LjU4MzdaIiBmaWxsPSIjNzQ3NDc0Ii8+CjxwYXRoIGQ9Ik0yNS45OTU4IDE4LjU4MzdDMjUuNzg0IDE4LjYzNzkgMjUuNTYyIDE4LjY2NjcgMjUuMzMzMyAxOC42NjY3QzIzLjg2MDYgMTguNjY2NyAyMi42NjY3IDE3LjQ3MjggMjIuNjY2NyAxNkMyMi42NjY3IDE0LjUyNzIgMjMuODYwNiAxMy4zMzMzIDI1LjMzMzMgMTMuMzMzM0MyNi44MDYxIDEzLjMzMzMgMjggMTQuNTI3MiAyOCAxNkMyOCAxNy4yNDQxIDI3LjE0ODEgMTguMjg5MiAyNS45OTU4IDE4LjU4MzdaIiBmaWxsPSIjNzQ3NDc0Ii8+CjxwYXRoIGQ9Ik03LjMyOTEgMTguNTgzN0M3LjExNzI5IDE4LjYzNzkgNi44OTUzNCAxOC42NjY3IDYuNjY2NjcgMTguNjY2N0M1LjE5MzkxIDE4LjY2NjcgNCAxNy40NzI4IDQgMTZDNCAxNC43NTAyIDQuODU5ODIgMTMuNzAxMiA2LjAyMDIxIDEzLjQxMjJDNi4yMjcxOCAxMy4zNjA3IDYuNDQzNzEgMTMuMzMzMyA2LjY2NjYzIDEzLjMzMzNDOC4xMzkzOSAxMy4zMzMzIDkuMzMzMyAxNC41MjcyIDkuMzMzMyAxNkM5LjMzMzMgMTcuMjQ0MSA4LjQ4MTM4IDE4LjI4OTIgNy4zMjkxIDE4LjU4MzdaIiBmaWxsPSIjNzQ3NDc0Ii8+CjwvZz4KPC9nPgo8L3N2Zz4K" alt="">' };
  function openShare(fid) {
    const f = friend(fid), n = picksOf(f).length;
    $('#sheet-share').innerHTML = `<div class="sheet__grabber"></div>
      <div class="sheet__header"><div id="share-title" class="b-share__title">Отправить ссылку ${f.dat}</div><div class="b-share__sub">Можете получить ${money(sumOf(f))} за${NB}${prods(n)}</div></div>
      <div class="b-share__list">${D.share.map(c => `<button class="b-share__cell" data-channel="${c.id}"><span class="b-share__ico b-share__ico--${c.id}">${ICON[c.id]}</span><span class="b-share__lbl">${c.label}</span></button>`).join('')}</div>`;
    openSheet();
  }

  /* ---------- Рендер с сохранением прокрутки ---------- */
  const R = { b1, b2, b3, b4 };
  function render(id) {
    const el = $('#scr-' + id), sc = $('.b-scroll', el), top = sc ? sc.scrollTop : 0;
    const lanes = Object.fromEntries($$('.b-lane', el).map(l => [l.dataset.lane, l.scrollLeft]));
    el.innerHTML = R[id]();
    const sc2 = $('.b-scroll', el); sc2.scrollTop = top;
    $$('.b-lane', el).forEach(l => { l.scrollLeft = lanes[l.dataset.lane] || 0; });
    const navEl = $('.b-nav', el);
    const onScroll = () => navEl.classList.toggle('is-scrolled', sc2.scrollTop > 4);
    sc2.addEventListener('scroll', onScroll, { passive: true }); onScroll();
  }
  const renderAll = () => Object.keys(R).forEach(render);

  /* ---------- Навигация (push/pop как в старом прототипе) ---------- */
  const screensEl = $('#screens');
  const scr = id => $(`.screen[data-screen="${id}"]`);
  let stack = ['b1'], busy = false;
  function setActive(id) {
    $$('.screen.is-active').forEach(s => s.classList.remove('is-active'));
    scr(id).classList.add('is-active');
    history.replaceState(null, '', location.pathname + location.search + '#' + id);
  }
  function animate(from, to, kind, done) {
    busy = true;
    const cls = kind === 'push' ? ['push-out', 'push-in'] : ['pop-out', 'pop-in'];
    from.classList.add(cls[0]); to.classList.add(cls[1]);
    screensEl.classList.add('is-animating'); screensEl.style.pointerEvents = 'none';
    void to.offsetWidth;
    requestAnimationFrame(() => { from.classList.add('go'); to.classList.add('go'); });
    setTimeout(() => {
      screensEl.classList.remove('is-animating'); screensEl.style.pointerEvents = '';
      [from, to].forEach(s => s.classList.remove('push-out', 'push-in', 'pop-out', 'pop-in', 'go'));
      setActive(to.dataset.screen); busy = false; done && done();
    }, 380);
  }
  function go(id) {
    if (busy) return;
    render(id); $('.b-scroll', scr(id)).scrollTop = 0; $$('.b-lane', scr(id)).forEach(l => { l.scrollLeft = 0; });
    const from = scr(stack[stack.length - 1]); stack.push(id); animate(from, scr(id), 'push');
  }
  function backTo(id) {
    if (busy || stack.length < 2) return;
    const from = scr(stack[stack.length - 1]);
    const i = stack.lastIndexOf(id); stack = stack.slice(0, i >= 0 ? i + 1 : stack.length - 1);
    const to = stack[stack.length - 1]; render(to); animate(from, scr(to), 'pop');
  }
  const back = () => backTo(stack[stack.length - 2]);

  /* ---------- Шторка: крестика на макете нет — закрывается тапом по фону и свайпом вниз ---------- */
  const sheet = $('#sheet-share'), scrim = $('#scrim');
  function openSheet() { sheet.style.transform = ''; scrim.classList.add('is-open'); sheet.classList.add('is-open'); }
  function closeSheet() {
    if (!sheet.classList.contains('is-open')) return;
    scrim.classList.remove('is-open'); sheet.classList.remove('is-open'); sheet.style.transform = '';
    sheet.classList.add('is-closing'); setTimeout(() => sheet.classList.remove('is-closing'), 320);
  }
  scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeSheet();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-step]')) { e.preventDefault(); e.target.click(); }
  });
  (() => { // свайп вниз за любое место шторки, горизонтальная прокрутка каналов не мешает
    let x0 = null, y0 = 0, dy = 0, drag = false, moved = false;
    sheet.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; dy = 0; drag = false; moved = false; });
    sheet.addEventListener('pointermove', e => {
      if (x0 === null) return;
      const dx = e.clientX - x0, d = e.clientY - y0;
      if (!drag) {
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(d)) { x0 = null; moved = true; return; }
        if (d > 8 && d > Math.abs(dx)) { drag = true; moved = true; sheet.style.transition = 'none'; try { sheet.setPointerCapture(e.pointerId); } catch (_) {} }
        else return;
      }
      dy = Math.max(0, d); sheet.style.transform = `translateY(${dy}px)`;
    });
    const end = () => { if (x0 === null && !drag) return; x0 = null; if (!drag) return; drag = false; sheet.style.transition = ''; if (dy > 80) closeSheet(); else sheet.style.transform = ''; };
    sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
    sheet.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  })();

  /* ---------- Тост ---------- */
  let toastTimer;
  function toast(t) { $('#toast-title').textContent = t; $('#toast').classList.add('is-open'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('is-open'), 2400); }

  /* ---------- Клики ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('button, [data-step]');
    if (!el || el.disabled) return;
    const d = el.dataset;
    if ('back' in d) back();
    else if (d.pickFriend) { state.friends.add(d.pickFriend); go('b2'); }
    else if (d.toggleFriend) { const id = d.toggleFriend; state.friends.has(id) ? state.friends.delete(id) : state.friends.add(id); render('b2'); }
    else if (d.togglePick) { const [f, p] = d.togglePick.split(':'); const s = state.picks[f]; s.has(p) ? s.delete(p) : s.add(p); render('b3'); }
    else if (d.goStep) go(d.goStep);
    else if (d.step) backTo('b' + (+d.step + 1));
    else if (d.share) openShare(d.share);
    else if ('home' in d) backTo('b1');
    else if (d.channel) {
      closeSheet();
      if (d.channel === 'copy') { try { navigator.clipboard && navigator.clipboard.writeText(D.link).catch(() => {}); } catch (_) {} setTimeout(() => toast('Ссылка скопирована'), 200); }
    }
  });

  /* ---------- Старт: #b1…#b4 в адресе; #b5 — B4 с открытой шторкой ---------- */
  renderAll();
  const h = location.hash.slice(1);
  if (['b2', 'b3', 'b4', 'b5'].includes(h)) {
    const order = ['b1', 'b2', 'b3', 'b4']; const to = h === 'b5' ? 'b4' : h;
    stack = order.slice(0, order.indexOf(to) + 1);
  }
  setActive(stack[stack.length - 1]);
  if (h === 'b5') openShare('vk');
  window.B = { state, go, back, backTo, openShare, closeSheet, render };
})();
